{% if page.paginator.num_pages > 1 %}
<div class="row">
    {% if page.has_previous %}
    <a class="btn secondary" href="?page={{ page.previous_page_number }}">← Anterior</a>
    {% else %}
    <span></span>
    {% endif %}

    <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>

    {% if page.has_next %}
    <a class="btn secondary" href="?page={{ page.next_page_number }}">Siguiente →</a>
    {% else %}
    <span></span>
    {% endif %}
</div>
{% endif %}
